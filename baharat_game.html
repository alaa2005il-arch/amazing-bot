<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BSF - بهاراتك يا موشي - معلقات تكريس ذاتي!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#0f172a;color:white;overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{background:#1e293b;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f59e0b}
h1{font-size:16px;color:#fbbf24}
.stats{display:flex;gap:6px;align-items:center}
.stat{font-size:13px;padding:4px 9px;border-radius:20px;font-weight:bold}
#score{background:#f59e0b;color:#000}
#lives{background:#ef4444;color:white}
#bsf{background:#1e40af;color:#93c5fd;border:1px solid #60a5fa}
#game{flex:1;position:relative;background:radial-gradient(circle at center,#1e293b 0%,#0f172a 70%);overflow:hidden;touch-action:none}
.item{position:absolute;width:62px;height:62px;font-size:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.6))}
.good{animation:float 2s ease-in-out infinite}
.bad{animation:shake 0.4s infinite alternate;filter:drop-shadow(0 0 12px rgba(239,68,68,0.9))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shake{0%{transform:rotate(-6deg)}100%{transform:rotate(6deg)}}
@keyframes fall{0%{transform:translateY(-100px)}100%{transform:translateY(110vh)}}
.bsf-wrap{position:absolute;top:-20px;display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:4;animation:sway 1.2s ease-in-out infinite alternate}
@keyframes sway{0%{transform:rotate(-4deg)}100%{transform:rotate(4deg)}}
.thread{width:2px;height:28px;background:linear-gradient(to bottom,#fbbf24,#92400e);box-shadow:0 0 4px #fbbf24}
.bsf-letter{width:52px;height:52px;background:radial-gradient(circle at 30% 30%,#fde047,#f59e0b);border:2px solid #fff;color:#000;font-weight:900;font-size:28px;display:flex;align-items:center;justify-content:center;border-radius:12px;box-shadow:0 4px 15px rgba(251,191,36,0.8), inset 0 -3px 0 rgba(0,0,0,0.3)}
.bsf-letter.B{background:radial-gradient(circle at 30% 30%,#93c5fd,#1e40af);color:white}
.bsf-letter.S{background:radial-gradient(circle at 30% 30%,#86efac,#15803d);color:white}
.bsf-letter.F{background:radial-gradient(circle at 30% 30%,#fca5a5,#b91c1c);color:white}
.falling{animation:fall linear forwards}
@keyframes popGood{0%{transform:scale(1)}50%{transform:scale(1.6)}100%{transform:scale(0);opacity:0}}
@keyframes popBad{0%{transform:scale(1)}30%
