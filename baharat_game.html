<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بهاراتك يا موشي - لعبة التلفون</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#0f172a;color:white;overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{background:#1e293b;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f59e0b}
h1{font-size:20px;color:#fbbf24}
#score{font-size:18px;background:#f59e0b;color:#000;padding:4px 12px;border-radius:20px;font-weight:bold}
#game{flex:1;position:relative;background:radial-gradient(circle at center,#1e293b,#0f172a);overflow:hidden;touch-action:none}
.baharat{position:absolute;width:60px;height:60px;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;animation:float 2s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}
.pop{animation:pop 0.3s forwards}
#controls{padding:12px;background:#1e293b;display:flex;gap:8px;justify-content:center}
.btn{flex:1;padding:14px;background:#f59e0b;color:#000;border:none;border-radius:12px;font-weight:800;font-size:16px}
.btn:active{transform:scale(0.96)}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:24px;border-radius:20px;text-align:center;display:none;z-index:10;min-width:260px;border:2px solid #f59e0b}
#msg.show{display:block}
#msg h2{color:#fbbf24;margin-bottom:8px}
</style>
</head>
<body>
<header>
<h1>🧂 بهاراتك يا موشي!</h1>
<div id="score">0 🪙</div>
</header>
<div id="game">
<div id="msg"><h2 id="msgTitle"></h2><p id="msgText"></p><button class="btn" style="margin-top:12px" onclick="startGame()">العب تاني 🔥</button></div>
</div>
<div id="controls">
<button class="btn" onclick="startGame()">ابدأ ▶️</button>
<button class="btn" style="background:#334155;color:white" onclick="shareGame()">شارك 📤</button>
</div>
<script>
let score=0,gameActive=false,spawnInterval,timeLeft=30,timer
const emojis=['🧂','🌶️','🫚','🧄','🌿','✨','💎','🪱']
const game=document.getElementById('game'),scoreEl=document.getElementById('score')
const msg=document.getElementById('msg'),msgTitle=document.getElementById('msgTitle'),msgText=document.getElementById('msgText')
function randomPos(){
 const rect=game.getBoundingClientRect()
 return {x:Math.random()*(rect.width-70)+10,y:Math.random()*(rect.height-80)+20}
}
function spawn(){
 if(!gameActive) return
 const el=document.createElement('div')
 el.className='baharat'
 el.textContent=emojis[Math.floor(Math.random()*emojis.length)]
 const pos=randomPos()
 el.style.left=pos.x+'px'
 el.style.top=pos.y+'px'
 el.onclick=()=>{
   if(!gameActive) return
   score+=10
   scoreEl.textContent=score+' 🪙'
   el.classList.add('pop')
   setTimeout(()=>el.remove(),300)
   if(navigator.vibrate) navigator.vibrate(30)
 }
 game.appendChild(el)
 setTimeout(()=>{if(el.parentNode) el.remove()},2000)
}
function startGame(){
 score=0;timeLeft=30;gameActive=true
 scoreEl.textContent='0 🪙'
 msg.classList.remove('show')
 game.querySelectorAll('.baharat').forEach(e=>e.remove())
 clearInterval(spawnInterval);clearInterval(timer)
 spawnInterval=setInterval(spawn,600)
 timer=setInterval(()=>{
   timeLeft--
   if(timeLeft<=0) endGame()
 },1000)
}
function endGame(){
 gameActive=false
 clearInterval(spawnInterval);clearInterval(timer)
 game.querySelectorAll('.baharat').forEach(e=>e.remove())
 msgTitle.textContent=timeLeft<=0?'خلص الوقت! ⏰':'بهارتك يا موشي! 🧂'
 msgText.textContent='جمعت '+score+' بهارة! '+(score>200?'أسطورة BSF! 👑':score>100?'زعامة عجيب! 🔥':'يلا حاول تاني 💪')
 msg.classList.add('show')
}
function shareGame(){
 if(navigator.share){navigator.share({title:'بهاراتك يا موشي',text:'العب معي! جمعت '+score+' بهارة',url:location.href})}
 else{alert('انسخ الرابط: '+location.href)}
}
setTimeout(startGame,500)
</script>
</body>
</html>
